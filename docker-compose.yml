name: turbostarter

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turbostarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turbostarter}
      POSTGRES_DB: ${POSTGRES_DB:-core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-turbostarter}",
          "-d",
          "${POSTGRES_DB:-core}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH: "${MAILPIT_SMTP_USER:-turbostarter}:${MAILPIT_SMTP_PASSWORD:-turbostarter}"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8025/api/v1/info",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # creates the gateway's own database in the shared Postgres; safe to re-run
  gateway-db:
    profiles: ["gateway"]
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-turbostarter}
      PGPASSWORD: ${POSTGRES_PASSWORD:-turbostarter}
      PGDATABASE: ${POSTGRES_DB:-core}
      GATEWAY_DB_NAME: ${GATEWAY_DB_NAME:-gateway}
    entrypoint: ["sh", "-c"]
    command:
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$GATEWAY_DB_NAME'" | grep -q 1 || createdb "$$GATEWAY_DB_NAME"

  gateway:
    profiles: ["gateway"]
    build:
      context: ./apps/gateway
      dockerfile: transports/Dockerfile.local
    restart: unless-stopped
    depends_on:
      gateway-db:
        condition: service_completed_successfully
    environment:
      GATEWAY_DB_HOST: db
      GATEWAY_DB_PORT: "5432"
      GATEWAY_DB_USER: ${POSTGRES_USER:-turbostarter}
      GATEWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-turbostarter}
      GATEWAY_DB_NAME: ${GATEWAY_DB_NAME:-gateway}
      BIFROST_SETUP_TOKEN: ${GATEWAY_SETUP_TOKEN:-local-setup-token}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - gateway_data:/app/data
      - ./apps/gateway/compose/config.json:/app/data/config.json:ro

volumes:
  postgres_data:
  gateway_data:
