nodeLinker: hoisted
linkWorkspacePackages: true
savePrefix: ""

packages:
  - apps/*
  - packages/**
  - tooling/*

catalog:
  "@hookform/resolvers": 5.2.2
  "@tanstack/react-query": 5.100.6
  "@tanstack/react-query-devtools": 5.100.6
  "@tanstack/react-table": 8.21.3
  envin: 1.2.0
  dayjs: 1.11.20
  react-hook-form: 7.74.0
  react-native: 0.86.0
  tailwindcss: 4.2.4
  typescript: 6.0.3
  vitest: 4.1.5
  "@vitest/coverage-v8": 4.1.5
  zod: 4.3.6
  zustand: 5.0.12

catalogs:
  node24:
    "@types/node": 24.0.0
  react19:
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    react: 19.2.3
    react-dom: 19.2.3
  turbo:
    "@turbo/gen": 2.10.0
    turbo: 2.10.0
    eslint-plugin-turbo: 2.10.0

allowBuilds:
  "@sentry/cli": true
  "@shopify/react-native-skia": true
  core-js: true
  esbuild: true
  expo-superwall: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  spawn-sync: true
  workerd: true

patchedDependencies:
  ai@7.0.2: patches/ai@7.0.2.patch
  react-native-ios-utilities@5.2.0: patches/react-native-ios-utilities@5.2.0.patch

minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.22"
  - "@better-auth/drizzle-adapter@1.6.22"
  - "@better-auth/expo@1.6.22"
  - "@better-auth/kysely-adapter@1.6.22"
  - "@better-auth/memory-adapter@1.6.22"
  - "@better-auth/mongo-adapter@1.6.22"
  - "@better-auth/passkey@1.6.22"
  - "@better-auth/prisma-adapter@1.6.22"
  - "@better-auth/telemetry@1.6.22"
  - better-auth@1.6.22
