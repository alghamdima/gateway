nodeLinker: hoisted
linkWorkspacePackages: true
savePrefix: ""

packages:
  - apps/*
  - packages/**
  - tooling/*

catalog:
  "@hookform/resolvers": 5.2.2
  "@tanstack/react-query": 5.100.6
  "@tanstack/react-query-devtools": 5.100.6
  "@tanstack/react-table": 8.21.3
  envin: 1.2.0
  dayjs: 1.11.20
  react-hook-form: 7.74.0
  react-native: 0.86.0
  tailwindcss: 4.2.4
  typescript: 6.0.3
  vitest: 4.1.5
  "@vitest/coverage-v8": 4.1.5
  zod: 4.3.6
  zustand: 5.0.12

catalogs:
  node24:
    "@types/node": ^24.0.0
  react19:
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    react: 19.2.3
    react-dom: 19.2.3
  turbo:
    "@turbo/gen": 2.10.5
    turbo: 2.10.5
    eslint-plugin-turbo: 2.10.5

allowBuilds:
  "@sentry/cli": true
  "@shopify/react-native-skia": true
  core-js: true
  esbuild: true
  expo-superwall: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  spawn-sync: true
  workerd: true

patchedDependencies:
  react-native-ios-utilities@5.2.0: patches/react-native-ios-utilities@5.2.0.patch

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.5"
  - "@turbo/darwin-arm64@2.10.5"
  - "@turbo/gen@2.10.5"
  - "@turbo/linux-64@2.10.5"
  - "@turbo/linux-arm64@2.10.5"
  - "@turbo/windows-64@2.10.5"
  - "@turbo/windows-arm64@2.10.5"
  - eslint-plugin-turbo@2.10.5
  - turbo@2.10.5
