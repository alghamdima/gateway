name: CI / Tests

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # You can leverage Remote Caching with Turbo to speed up your builds
  # @link https://turbo.build/repo/docs/guides/ci-vendors/github-actions
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  checks:
    name: 📝 Checks
    runs-on: ubuntu-latest

    # the credits ledger tests need real Postgres (constraints, roles, triggers, concurrency);
    # each run creates and drops its own database next to this one
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lemru
          POSTGRES_PASSWORD: lemru
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lemru -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v7

      - name: 🔨 Setup
        uses: ./tooling/github/setup

      - name: 🖌️ Format
        run: node --run format

      - name: 🛻 Lint
        run: node --run lint -- --format=github

      # oxlint does not check types; without this a type error in a package or a test
      # reaches main
      - name: 🔎 Typecheck
        run: node --run typecheck

      # The template's name must not come back with an upstream merge. The paths left out are
      # where it belongs: the template's license, engineering notes on where the code came
      # from, the template's docs server for developers, its version check, and a test that
      # refuses the removed app's URL scheme.
      - name: 🏷️ Brand
        run: |
          ! git grep -Iil -e turbostarter -- . \
            ':!LICENSE.md' ':!docs/platform' ':!.mcp.json' ':!AGENTS.md' \
            ':!tooling/scripts/src/version.mjs' \
            ':!packages/auth/src/lib/test/utils.test.ts' \
            ':!.github/workflows/tests.yml'

      - name: 🧪 Test
        run: node --run test
        env:
          DATABASE_URL: postgresql://lemru:lemru@localhost:5432/core
