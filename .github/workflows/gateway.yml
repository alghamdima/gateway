name: CI / Gateway

on:
  pull_request:
    branches: ["*"]
    paths:
      - "apps/gateway/**"
      - "docs/platform/gateway-baseline/**"
      - "packages/db/migrations/**"
      - ".github/workflows/gateway.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/gateway/**"
      - "docs/platform/gateway-baseline/**"
      - "packages/db/migrations/**"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # the job runs the whole Go suite and takes most of an hour; let a run finish and queue the next
  # one instead of losing it to every push
  cancel-in-progress: false

jobs:
  gateway:
    name: 🚪 Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/gateway

    # the credits plugin's tests run against real Postgres with the control plane's migrations
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turbostarter
          POSTGRES_PASSWORD: turbostarter
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbostarter -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v7

      - name: 🔨 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/gateway/go.work
          cache-dependency-path: apps/gateway/**/go.sum

      - name: 🔨 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/gateway/.nvmrc
          cache: npm
          cache-dependency-path: apps/gateway/ui/package-lock.json

      # the committed tree must equal the pinned upstream tag plus patches/ (ADR 0008)
      - name: 🧬 Reproduce from upstream
        run: |
          repo=$(sed -n 's/^repo: //p' UPSTREAM)
          tag=$(sed -n 's/^tag: //p' UPSTREAM)
          git clone --quiet --filter=blob:none --no-checkout --depth 1 --branch "$tag" "$repo" "$RUNNER_TEMP/upstream"
          scripts/import.sh "$RUNNER_TEMP/upstream" "$tag"
          git status --porcelain -- . | tee "$RUNNER_TEMP/drift"
          test ! -s "$RUNNER_TEMP/drift"

      - name: 🏷️ Rename tool tests
        working-directory: apps/gateway/scripts/rename
        run: GOWORK=off go test ./...

      - name: 💳 Credits plugin tests
        working-directory: apps/gateway/plugins/credits
        run: go test -count=1 -race ./...
        env:
          CREDITS_TEST_DATABASE_URL: postgresql://turbostarter:turbostarter@localhost:5432/core

      - name: 🏗️ Build
        run: make build LOCAL=1

      - name: 🔎 Vet
        run: |
          for mod in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            (cd "$mod" && go vet ./...)
          done

      - name: 🧪 Test against the baseline
        run: scripts/test.sh
